server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    deserialization:
      fail-on-unknown-properties: false

# URL of the product-service this service depends on.
# Override with SERVICES_PRODUCT_SERVICE_URL env var in other environments
# (e.g. http://product-service:8081 inside Docker/Kubernetes).
services:
  product-service:
    url: ${SERVICES_PRODUCT_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
