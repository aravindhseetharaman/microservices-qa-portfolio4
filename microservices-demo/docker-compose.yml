version: "3.8"

services:
  product-service:
    build: ./product-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  order-service:
    build: ./order-service
    ports:
      - "8082:8082"
    environment:
      - SERVICES_PRODUCT_SERVICE_URL=http://product-service:8081
    depends_on:
      - product-service
